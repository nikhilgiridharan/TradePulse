# MarketFlow full stack: Zookeeper, Kafka, Schema Registry, producer, processing, API.
# Named volumes persist Kafka/Zookeeper data so offsets and topics survive restarts.

services:
  # Zookeeper: required for Kafka coordination (broker election, topic metadata).
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Kafka: 6 partitions = ~2 per ticker for 5 tickers with room to grow.
  # Replication factor 1 for local dev; use 3 in production for durability.
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Schema Registry: enforces contract between producer and consumer (Avro/JSON schema).
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092

  # Producer: separate service for independent scaling and failure domain.
  marketflow-producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    depends_on:
      kafka:
        condition: service_healthy
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure

  # Faust processing: consumes trades, validates, aggregates, anomalies, writes DynamoDB.
  marketflow-processing:
    build:
      context: .
      dockerfile: Dockerfile.processing
    depends_on:
      kafka:
        condition: service_healthy
      marketflow-producer:
        condition: service_started
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure

  # API: depends on processing so aggregations are populated before serving.
  marketflow-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    depends_on:
      marketflow-processing:
        condition: service_started
    env_file: .env
    restart: unless-stopped

volumes:
  kafka-data:
  zookeeper-data:
